app_admin_two_factor_enroll:
    path: /%sylius_admin.path_name%/two-factor/enroll
    controller: Tavy315\SyliusTwoFactorPlugin\Controller\EnrollmentController
    defaults: { twoFactorArea: admin }
    methods: [ GET ]

app_admin_two_factor_confirm:
    path: /%sylius_admin.path_name%/two-factor/confirm
    controller: Tavy315\SyliusTwoFactorPlugin\Controller\ConfirmationController
    defaults: { twoFactorArea: admin }
    methods: [ POST ]

app_admin_two_factor_acknowledge:
    path: /%sylius_admin.path_name%/two-factor/acknowledge
    controller: Tavy315\SyliusTwoFactorPlugin\Controller\AcknowledgementController
    defaults: { twoFactorArea: admin }
    methods: [ POST ]

app_admin_two_factor_verify:
    path: /%sylius_admin.path_name%/two-factor/verify
    controller: Tavy315\SyliusTwoFactorPlugin\Controller\VerificationController
    defaults: { twoFactorArea: admin }
    methods: [ GET, POST ]

app_shop_two_factor_enroll:
    path: /two-factor/enroll
    controller: Tavy315\SyliusTwoFactorPlugin\Controller\EnrollmentController
    defaults: { twoFactorArea: shop }
    methods: [ GET ]

app_shop_two_factor_confirm:
    path: /two-factor/confirm
    controller: Tavy315\SyliusTwoFactorPlugin\Controller\ConfirmationController
    defaults: { twoFactorArea: shop }
    methods: [ POST ]

app_shop_two_factor_acknowledge:
    path: /two-factor/acknowledge
    controller: Tavy315\SyliusTwoFactorPlugin\Controller\AcknowledgementController
    defaults: { twoFactorArea: shop }
    methods: [ POST ]

app_shop_two_factor_verify:
    path: /two-factor/verify
    controller: Tavy315\SyliusTwoFactorPlugin\Controller\VerificationController
    defaults: { twoFactorArea: shop }
    methods: [ GET, POST ]
